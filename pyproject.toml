[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netthreat-agent"
version = "0.1.0"
description = "Consent-based local security snapshot collector"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<8"]

[project.scripts]
netthreat-vision = "netthreat_agent.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]